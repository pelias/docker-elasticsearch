bootstrap.memory_lock: true
network.host: 0.0.0.0
http.port: 9200
thread_pool:
  write:
    queue_size: 1000

# ES8 enables TLS and authentication by default, pelias expects plain http
xpack.security.enabled: false

# avoid downloading GeoIP databases on startup, pelias doesn't use them
ingest.geoip.downloader.enabled: false
